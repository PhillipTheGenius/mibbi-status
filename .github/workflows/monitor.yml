name: Public availability checks
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-status
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Check public routes
        id: probe
        continue-on-error: true
        run: node monitor.mjs
      - name: Save public results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name 'Mibbi status monitor'
          git config user.email 'status@users.noreply.github.com'
          git add status.json history.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record public availability check'
          gh auth setup-git
          git push
      - name: Request GitHub failure notification
        if: steps.probe.outcome == 'failure'
        run: |
          echo 'A public check failed. See status.json and investigate. GitHub notification delivery depends on the owner notification settings.'
          exit 1
